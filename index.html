    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: #2d3748;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        .header {
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            margin-right: 0.5rem;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        /* Main Content Styles */
        .main {
            min-height: calc(100vh - 80px);
            padding: 2rem 0;
        }

        /* Hero Section */
        .hero-modern {
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 4rem;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            max-width: 800px;
            padding: 0 2rem;
        }

        .hero-text h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .hero-text h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            opacity: 0.95;
        }

        .hero-text p {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .hero-cta {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(37, 99, 235, 0.4);
        }

        /* Features Section */
        .features-section {
            text-align: center;
            padding: 4rem 0;
            background-color: var(--bg);
        }

        .features-section h3 {
            font-size: 2.8rem;
            color: var(--text);
            margin-bottom: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .feature-card {
            background: var(--bg-elevated);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        .feature-image {
            height: 160px;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .feature-image.fundamentals {
            background-image: url('./images/pm-fundamentals.jpg');
        }

        .feature-image.skills {
            background-image: url('./images/pm-skills.jpg');
        }

        .feature-image.ai {
            background-image: url('./images/ai-assistant.jpg');
        }

        .feature-image.jobs {
            background-image: url('./images/job-opportunities.jpg');
        }

        /* Fallback gradient if images don't load */
        .feature-image.fundamentals:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
            z-index: -1;
        }

        .feature-image.skills:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            z-index: -1;
        }

        .feature-image.ai:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            z-index: -1;
        }

        .feature-image.jobs:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            z-index: -1;
        }
        
        .feature-content {
            padding: 1.5rem 2rem 2rem;
            text-align: left;
            background: var(--bg-elevated);
        }

        .feature-content h4 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .feature-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 400;
        }

        /* Section Styles */
        .section {
            margin: 4rem 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .section-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Content Styles */
        .content-card {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid #e2e8f0;
        }

        .content-card h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .content-card ul {
            list-style: none;
            padding-left: 0;
        }

        .content-card li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .content-card li:last-child {
            border-bottom: none;
        }

        /* AI Assistant Styles */
        .chat-container {
            background: var(--bg-elevated);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            max-width: 800px;
            margin: 0 auto;
        }

        .chat-header {
            background: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
        }

        .message {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
        }

        .message.user {
            background: #dbeafe;
            margin-left: 2rem;
        }

        .message.ai {
            background: #f1f5f9;
            margin-right: 2rem;
        }

        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 1rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        /* Button Styles */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }
        /* Modern AI Assistant Styles */
.ai-hero {
    background: rgba(255, 255, 255, 0.6);
    text-align: center;
    padding: 4rem 0;
    border-radius: 16px;
    margin-bottom: 3rem;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
}

.ai-hero h1 {
    font-size: 2.5rem;
    color: var(--text);
    margin-bottom: 1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
}

.ai-hero p {
    font-size: 1.3rem;
    color: var(--text-muted);
    max-width: 800px;
    margin: 0 auto;
    line-height: 1.7;
}

.ai-info-section {
    margin: 0 auto 1.5rem;
    max-width: 900px;
}

.ai-info-grid {
    display: flex !important;
    flex-wrap: wrap;
    gap: 0.5rem 0.65rem;
    justify-content: center;
    grid-template-columns: none !important;
}

.ai-info-item {
    background: transparent;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: none;
    transition: border-color var(--transition);
}

.ai-info-item:hover {
    border-color: var(--primary);
}

.ai-info-item h3 {
    color: var(--primary);
    font-size: 0.8rem;
    margin: 0;
    font-weight: 600;
    font-family: var(--font-body);
}

.ai-info-item p {
    display: none;
}

.chat-container-modern {
    background: var(--bg-elevated);
    border-radius: var(--radius-lg);
    overflow: hidden;
    max-width: 900px;
    margin: 0 auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
}

.chat-header-modern {
    background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(13, 148, 136, 0.1));
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--border);
}

.chat-status {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    font-family: var(--font-body);
}

.chat-status-meta {
    margin-left: auto;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.02em;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
}

.chat-messages-modern {
    height: 500px;
    overflow-y: auto;
    padding: 1.75rem 2rem;
    background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(79, 70, 229, 0.05), transparent 55%),
        radial-gradient(ellipse 70% 45% at 95% 100%, rgba(13, 148, 136, 0.06), transparent 50%),
        var(--bg);
}

.message-modern {
    margin-bottom: 1.35rem;
    animation: chatMsgIn 0.32s ease-out;
}

@keyframes chatMsgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-modern.user {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.message-modern.ai {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.message-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
    font-weight: 550;
}

.message-content {
    background: var(--bg-elevated);
    padding: 1rem 1.2rem;
    border-radius: 16px 16px 16px 6px;
    max-width: 75%;
    line-height: 1.65;
    color: var(--text);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    box-shadow: none;
}

.message-modern.user .message-content {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: #fff;
    border: none;
    border-left: none;
    border-radius: 16px 16px 6px 16px;
}

.typing-indicator {
    display: flex;
    gap: 5px;
    padding: 0.35rem 0;
}

.typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-indicator span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typing {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
}

.chat-input-modern {
    padding: 1.25rem 1.5rem;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.85rem;
    align-items: center;
}

.input-modern {
    flex: 1;
    padding: 0.875rem 1.25rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    outline: none;
    font-size: 0.95rem;
    font-family: var(--font-body);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    background: var(--bg);
    color: var(--text);
}

.input-modern:focus {
    border-color: var(--primary);
    background: var(--bg-elevated);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.send-btn-modern {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: white;
    border: none;
    border-radius: 12px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform var(--transition), filter var(--transition);
    box-shadow: none;
}

.send-btn-modern:hover:not(:disabled) {
    transform: scale(1.04);
    filter: brightness(1.05);
}

.send-btn-modern:active:not(:disabled) {
    transform: scale(0.96);
}

.send-btn-modern:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.ai-info-section {
    margin: 0 auto 1.5rem;
    max-width: 900px;
}

.ai-info-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 0.65rem;
    justify-content: center;
}

.ai-info-item {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    box-shadow: none;
}

.ai-info-item h3 {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--primary);
    font-family: var(--font-body);
}

.ai-info-item p {
    display: none;
}

/* Responsive for AI Assistant */
@media (max-width: 768px) {
    .ai-info-grid {
        justify-content: flex-start;
    }
    
    .chat-messages-modern {
        height: 400px;
        padding: 1.25rem;
    }
    
    .message-content {
        max-width: 88%;
    }

    .chat-status {
        flex-wrap: wrap;
        gap: 0.4rem 0.75rem;
    }

    .chat-status-meta {
        margin-left: 1.5rem;
        width: 100%;
    }
}
        


        /* Job Alert Page Styles */
.job-hero {
    background: rgba(255, 255, 255, 0.6);

    padding: 4rem 0;
    border-radius: 16px;
    margin-bottom: 3rem;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
}

.job-hero h1 {
    font-size: 2.5rem;

}

.job-stats {

.job-filters {

}

.filter-toggle {

.job-card-modern:hover {

.job-card-modern.closed {

.job-badge.open {

            position: relative;

        .mindmap-center {
            position: absolute;

            color: white;

/* PMory Design System — site-wide */
:root {
    --bg: #f0f3fa;
    --bg-elevated: #ffffff;
    --bg-muted: #e4e9f4;
    --text: #12182b;
    --text-muted: #5c6578;
    --primary: #4f46e5;
    --primary-dark: #3730a3;
    --accent: #0d9488;
    --accent-soft: #ccfbf1;
    --border: rgba(18, 24, 43, 0.09);
    --shadow: 0 4px 24px rgba(18, 24, 43, 0.07);
    --shadow-lg: 0 16px 48px rgba(18, 24, 43, 0.1);
    --radius: 14px;
    --radius-lg: 20px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --transition: 200ms ease-out;
    --gradient: linear-gradient(135deg, #4f46e5 0%, #0d9488 100%);
}

[data-theme="dark"] {
    --bg: #0c1018;
    --bg-elevated: #151b28;
    --bg-muted: #1e2738;
    --text: #eef1f8;
    --text-muted: #94a0b8;
    --primary: #818cf8;
    --primary-dark: var(--primary);
    --accent: #2dd4bf;
    --accent-soft: #134e4a;
    --border: rgba(238, 241, 248, 0.08);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
}

body {
    font-family: var(--font-body) !important;
    background-color: var(--bg) !important;
    color: var(--text) !important;
    transition: background-color 0.3s, color 0.3s;
}

.container {
    max-width: 1080px !important;
    margin: 0 auto !important;
    padding: 0 24px !important;
    width: 100%;
}

.header {
    background: color-mix(in srgb, var(--bg) 88%, transparent) !important;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
}
.header .logo { color: var(--primary) !important; }
.nav-link { color: var(--text-muted) !important; }
.nav-link:hover, .nav-link.active { color: var(--primary) !important; }

.theme-toggle {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    transition: all var(--transition);
    list-style: none;
}
.theme-toggle:hover { box-shadow: var(--shadow); }

.page-transition { animation: pageIn 0.35s ease-out; }
@keyframes pageIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Shared page chrome */
.page-hero,
.pm-hero, .skillsets-hero, .ai-hero, .job-hero, .about-hero {
    background: var(--bg-elevated) !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius-lg) !important;
    padding: 2.5rem 2rem !important;
    text-align: center !important;
    margin-bottom: 2.5rem !important;
    box-shadow: var(--shadow) !important;
}

.page-hero h1,
.pm-hero h1, .skillsets-hero h1, .ai-hero h1, .job-hero h1, .about-hero h1 {
    font-family: var(--font-display) !important;
    color: var(--text) !important;
    font-weight: 700 !important;
}

.page-subtitle,
.pm-definition, .skillsets-hero p, .ai-hero p, .job-hero p, .about-hero p, .hero-subtitle {
    color: var(--text-muted) !important;
    max-width: 640px;
    margin-left: auto !important;
    margin-right: auto !important;
}

.section-title {
    font-family: var(--font-display) !important;
    color: var(--text) !important;
    text-align: center !important;
}

.section { text-align: center; }

/* Cards & surfaces */
.feature-card, .resource-card, .skill-card, .job-card-modern,
.about-card, .stat-card, .admin-login, .admin-panel,
.pm-definition-section, .responsibility-detail,
.chat-container-modern, .email-subscription {
    background: var(--bg-elevated) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
    box-shadow: var(--shadow) !important;
}

.feature-card:hover, .skill-card:hover, .job-card-modern:hover, .about-card:hover {
    border-color: var(--primary) !important;
    box-shadow: var(--shadow-lg) !important;
}

.pm-definition-content h2, .pm-definition-content p,
.skill-card h3, .skill-card p, .job-meta h3,
.about-card h2, .about-card p { color: var(--text) !important; }
.pm-definition-content p, .skill-card p { color: var(--text-muted) !important; }

.btn-primary, .hero-cta, .subscribe-btn, .send-btn-modern {
    background: var(--gradient) !important;
    color: white !important;
    border: none !important;
}
.btn-secondary { background: var(--bg-muted) !important; color: var(--text) !important; border: 1px solid var(--border) !important; }

.mindmap-center { background: var(--gradient) !important; }
.mindmap-node { background: var(--bg-elevated) !important; border: 2px solid var(--primary) !important; color: var(--text) !important; }

.stat-number { color: var(--primary) !important; }
.email-subscription { background: var(--gradient) !important; }

.footer {
    background: var(--bg-elevated) !important;
    border-top: 1px solid var(--border) !important;
    color: var(--text-muted) !important;
    text-align: center;
}

.form-input, .input-modern, .email-input {
    background: var(--bg) !important;
    border: 1px solid var(--border) !important;
    color: var(--text) !important;
}
.form-input:focus, .input-modern:focus { border-color: var(--primary) !important; }

.category-tab.active, .filter-toggle.active {
    background: var(--gradient) !important;
    color: white !important;
}

/* Homepage */
.hero-v2 {
    position: relative;
    min-height: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: center;
    padding: 3rem 0 2rem;
    max-width: 1080px;
    margin: 0 auto;
}
.hero-v2-left, .hero-v2-right { position: relative; z-index: 1; }
.hero-eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.35rem 0.75rem;
    border-radius: 50px;
    margin-bottom: 1rem;
}
.hero-v2 h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 5vw, 3.75rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 0.5rem;
    color: var(--text);
}
.hero-typing {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600;
    color: var(--primary);
    min-height: 2.5rem;
    margin-bottom: 1.25rem;
}
.hero-typing-cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: var(--primary);
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
}
@keyframes blink { 50% { opacity: 0; } }
.hero-v2-desc {
    font-size: 1.05rem;
    color: var(--text-muted);
    max-width: 480px;
    margin-bottom: 1.75rem;
    line-height: 1.7;
}
.hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

.magnetic-btn {
    position: relative;
    background: var(--gradient);
    color: white;
    border: none;
    padding: 0.9rem 1.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: box-shadow var(--transition), transform 0.1s;
    box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
}
.magnetic-btn:hover { box-shadow: 0 10px 28px rgba(79, 70, 229, 0.4); }
.magnetic-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.magnetic-btn:active { transform: scale(0.97); }
.magnetic-btn.secondary {
    background: var(--bg-elevated);
    color: var(--text);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
}

.hero-ai-demo {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}
.hero-ai-header {
    padding: 1rem 1.25rem;
    background: var(--gradient);
    color: white;
    font-weight: 600;
}
.hero-ai-body { padding: 1.25rem; }
.hero-ai-bubble {
    background: var(--bg-muted);
    padding: 0.875rem 1rem;
    border-radius: 12px 12px 12px 4px;
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
    color: var(--text);
    text-align: left;
}
.hero-ai-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.hero-ai-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.5rem 0.875rem;
    border-radius: 50px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all var(--transition);
    color: var(--text-muted);
}
.hero-ai-chip:hover { border-color: var(--primary); color: var(--primary); }

.home-sections {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 3rem;
}

.bento-section { margin: 2rem auto 3rem; text-align: center; }
.section-eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 0.5rem;
}
.section-title-v2 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3vw, 2.25rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--text);
}
.section-subtitle-v2 {
    color: var(--text-muted);
    margin: 0 auto 2rem;
    max-width: 520px;
}
.bento-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    max-width: 720px;
    margin: 0 auto;
}
.bento-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    min-height: 180px;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align: left;
}
.bento-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
.bento-card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.2;
    transition: opacity 0.3s;
}
.bento-card:hover .bento-card-bg { opacity: 0.35; }
.bento-card h4 { font-family: var(--font-display); font-size: 1.15rem; position: relative; z-index: 1; color: var(--text); }
.bento-card p { font-size: 0.82rem; color: var(--text-muted); position: relative; z-index: 1; margin-top: 0.25rem; }
.bento-icon { font-size: 1.75rem; margin-bottom: auto; position: relative; z-index: 1; }

.playground-section {
    margin: 0 auto 2rem;
    padding: 2rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    max-width: 960px;
    text-align: center;
}
.playground-section h3 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin-bottom: 0.35rem;
    color: var(--text);
}
.playground-section .hint { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.25rem; }

.prio-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: left; }
.prio-column {
    background: var(--bg);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    min-height: 200px;
}
.prio-column h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center; }
.prio-column.now { border-color: #f87171; }
.prio-column.next { border-color: var(--accent); }
.prio-column.later { border-color: var(--primary); }
.prio-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.5rem;
    cursor: grab;
    font-size: 0.88rem;
    transition: all var(--transition);
}
.prio-item:hover { box-shadow: var(--shadow); }

.sticky-wall {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
    min-height: 160px;
    padding: 1rem;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
}
.sticky-note {
    width: 130px;
    min-height: 110px;
    padding: 0.9rem;
    border-radius: 4px;
    font-size: 0.82rem;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.12);
    animation: notePop 0.35s ease-out;
}
@keyframes notePop {
    from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
    to { opacity: 1; transform: rotate(var(--rot, -2deg)); }
}
.sticky-note.yellow { background: #fef08a; color: #713f12; transform: rotate(-3deg); }
.sticky-note.pink { background: #fbcfe8; color: #831843; transform: rotate(2deg); }
.sticky-note.blue { background: #bfdbfe; color: #1e3a8a; transform: rotate(-1deg); }
.sticky-note.green { background: #bbf7d0; color: #14532d; transform: rotate(3deg); }
.sticky-input-row { display: flex; gap: 0.75rem; margin-top: 1rem; max-width: 480px; margin-left: auto; margin-right: auto; }
.sticky-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
}

.roadmap {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 1.5rem 0;
}
.roadmap::before {
    content: '';
    position: absolute;
    top: 2rem;
    left: 8%;
    right: 8%;
    height: 3px;
    background: var(--border);
}
.roadmap-progress {
    position: absolute;
    top: 2rem;
    left: 8%;
    height: 3px;
    background: var(--gradient);
    border-radius: 2px;
    transition: width 0.6s ease-out;
}
.roadmap-item {
    flex: 1;
    text-align: center;
    position: relative;
    z-index: 1;
    opacity: 0.35;
    transform: translateY(12px);
    transition: all 0.5s ease-out;
}
.roadmap-item.visible { opacity: 1; transform: translateY(0); }
.roadmap-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 3px solid var(--border);
    margin: 0 auto 0.75rem;
}
.roadmap-item.visible .roadmap-dot {
    border-color: var(--primary);
    background: var(--primary);
}
.roadmap-item h4 { font-size: 0.88rem; font-weight: 700; color: var(--text); }
.roadmap-item p { font-size: 0.75rem; color: var(--text-muted); }

.ship-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    text-align: left;
}
.ship-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.15rem;
    transition: all 0.3s;
}
.ship-card h4 { font-size: 0.95rem; margin-bottom: 0.3rem; color: var(--text); }
.ship-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.85rem; }
.ship-actions { display: flex; gap: 0.5rem; }
.ship-btn {
    flex: 1;
    padding: 0.55rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
}
.ship-btn.ship { background: #dcfce7; color: #166534; }
.ship-btn.kill { background: #fee2e2; color: #991b1b; }
.ship-card.voted-ship { border-color: #22c55e; }
.ship-card.voted-kill { border-color: #ef4444; opacity: 0.75; }
.ship-score { text-align: center; margin-top: 1rem; font-size: 0.88rem; color: var(--text-muted); }

/* Inner page layout helpers */
.pm-definition-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    align-items: center;
    padding: 2rem !important;
    border-radius: var(--radius-lg) !important;
    margin-bottom: 2.5rem;
    text-align: left;
}
.pm-definition-image img { border-radius: var(--radius); width: 100%; }
.pm-definition-content { text-align: left; }

.mindmap-section { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 2rem; }
.resources-grid, .skills-grid, .about-grid, .job-stats, .ai-info-grid {
    max-width: 900px;
    margin-left: auto !important;
    margin-right: auto !important;
}

.skillsets-container, .chat-container-modern { max-width: 900px; margin: 0 auto; }

@media (max-width: 900px) {
    .hero-v2 { grid-template-columns: 1fr; padding: 2rem 0; }
    .pm-definition-section { grid-template-columns: 1fr; }
    .prio-board { grid-template-columns: 1fr; }
    .roadmap { flex-direction: column; gap: 1.25rem; }
    .roadmap::before, .roadmap-progress { display: none; }
}
@media (max-width: 640px) {
    .bento-grid { grid-template-columns: 1fr; max-width: 360px; }
    .playground-section { padding: 1.25rem; }
    .nav-links li:not(:last-child) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    .page-transition, .hero-typing-cursor, .roadmap-item, .sticky-note, .ship-card { animation: none !important; transition: none !important; }
}

/* Dark mode — legacy class overrides */
[data-theme="dark"] .features-section,
[data-theme="dark"] .skill-card,
[data-theme="dark"] .resource-card,
[data-theme="dark"] .category-tab,
[data-theme="dark"] .filter-toggle,
[data-theme="dark"] .admin-job-item {
    background: var(--bg-elevated) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
}
[data-theme="dark"] .skill-card p,
[data-theme="dark"] .resource-link,
[data-theme="dark"] .posted-date,
[data-theme="dark"] .job-meta p {
    color: var(--text-muted) !important;
}
[data-theme="dark"] .chat-messages-modern {
    background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(129, 140, 248, 0.08), transparent 55%),
        radial-gradient(ellipse 70% 45% at 95% 100%, rgba(45, 212, 191, 0.07), transparent 50%),
        var(--bg) !important;
}
[data-theme="dark"] .message-content {
    background: var(--bg-elevated) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
}
[data-theme="dark"] .message-modern.user .message-content {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%) !important;
    color: #fff !important;
    border: none !important;
}
[data-theme="dark"] .chat-header-modern {
    background: linear-gradient(135deg, rgba(129, 140, 248, 0.12), rgba(45, 212, 191, 0.1)) !important;
}
[data-theme="dark"] .chat-input-modern {
    background: var(--bg-elevated) !important;
    border-color: var(--border) !important;
}
[data-theme="dark"] .input-modern {
    background: var(--bg) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
}

/* ——— Inner pages redesign ——— */
.section-header-block {
    text-align: center;
    margin-bottom: 2rem;
}

.page-block {
    margin-bottom: 3.5rem;
}

/* Core Responsibilities */
.resp-layout {
    display: grid;
    grid-template-columns: minmax(240px, 320px) 1fr;
    gap: 1.25rem;
    max-width: 920px;
    margin: 0 auto;
    align-items: stretch;
}
.resp-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.resp-item {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    width: 100%;
    text-align: left;
    padding: 0.9rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elevated);
    color: var(--text);
    cursor: pointer;
    transition: all var(--transition);
    font-family: var(--font-body);
    font-size: 0.92rem;
}
.resp-item:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
}
.resp-item.active {
    background: var(--gradient);
    border-color: transparent;
    color: white;
}
.resp-index {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    opacity: 0.7;
    min-width: 1.5rem;
}
.resp-name { font-weight: 600; line-height: 1.3; }
.resp-detail-panel {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 280px;
}
.resp-detail-panel h3 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 1rem;
}
.resp-detail-panel p {
    color: var(--text-muted);
    line-height: 1.75;
    font-size: 1rem;
}

/* Learning Resources hub */
.resources-hub {
    max-width: 920px;
    margin: 0 auto;
}
.resources-board {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
}
.resource-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 1.5rem;
    padding: 1.5rem 1.75rem;
    border-bottom: 1px solid var(--border);
    align-items: start;
}
.resource-row:last-child { border-bottom: none; }
.resource-type-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--primary);
    padding-top: 0.2rem;
}
.resource-link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
}
.resource-link-list a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    transition: all var(--transition);
}
.resource-link-list a:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateX(4px);
}
.resource-link-list a::after {

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // PMory backend — update if Lambda Function URL changes after deploy
        const CHAT_API_URL = 'https://cjrhfzkkxxi6qvhwbt7pc2wosm0azgfk.lambda-url.us-east-1.on.aws/api/chat';
        const EMAIL_LAMBDA_URL = 'https://wkndwo73luez66sxx636udqiwu0dkodi.lambda-url.us-east-1.on.aws';

        // Logo Component
        const Logo = () => (
            <svg className="logo-icon" viewBox="0 0 100 100">
                <circle cx="30" cy="35" r="20" fill="none" stroke="currentColor" strokeWidth="4" />
                <circle cx="50" cy="35" r="20" fill="none" stroke="currentColor" strokeWidth="4" />
                <circle cx="40" cy="55" r="20" fill="none" stroke="currentColor" strokeWidth="4" />
            </svg>
        );

        // Header Component
        const Header = ({ currentPage, setCurrentPage, darkMode, setDarkMode }) => (
            <header className="header">
                <div className="container">
                    <nav className="nav">
                        <div className="logo">
                            <Logo />
                            PMory
                        </div>
                        <ul className="nav-links">
                            <li><a className={`nav-link ${currentPage === 'home' ? 'active' : ''}`} onClick={() => setCurrentPage('home')}>Home</a></li>
                            <li><a className={`nav-link ${currentPage === 'what-is-pm' ? 'active' : ''}`} onClick={() => setCurrentPage('what-is-pm')}>What is PM</a></li>
                            <li><a className={`nav-link ${currentPage === 'skillsets' ? 'active' : ''}`} onClick={() => setCurrentPage('skillsets')}>Skillsets</a></li>
                            <li><a className={`nav-link ${currentPage === 'ai-assistant' ? 'active' : ''}`} onClick={() => setCurrentPage('ai-assistant')}>AI Assistant</a></li>
                            <li><a className={`nav-link ${currentPage === 'job-alert' ? 'active' : ''}`} onClick={() => setCurrentPage('job-alert')}>Job Alert</a></li>
                            <li><a className={`nav-link ${currentPage === 'about' ? 'active' : ''}`} onClick={() => setCurrentPage('about')}>About</a></li>
                            <li>
                                <button type="button" className="theme-toggle" onClick={() => setDarkMode(!darkMode)} aria-label="Toggle dark mode" aria-pressed={darkMode}>
                                    {darkMode ? '☀️ Light' : '🌙 Night Shift'}
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </header>
        );

// ========== HOMEPAGE V2 UTILITIES & COMPONENTS ==========

        const useTypingEffect = (words, speed = 80, pause = 2000) => {
            const [text, setText] = useState('');
            const [wordIndex, setWordIndex] = useState(0);
            const [charIndex, setCharIndex] = useState(0);
            const [deleting, setDeleting] = useState(false);

            useEffect(() => {
                const current = words[wordIndex % words.length];
                const timeout = setTimeout(() => {
                    if (!deleting) {
                        setText(current.slice(0, charIndex + 1));
                        if (charIndex + 1 === current.length) {
                            setTimeout(() => setDeleting(true), pause);
                        } else {
                            setCharIndex(charIndex + 1);
                        }
                    } else {
                        setText(current.slice(0, charIndex - 1));
                        if (charIndex === 0) {
                            setDeleting(false);
                            setWordIndex((wordIndex + 1) % words.length);
                        } else {
                            setCharIndex(charIndex - 1);
                        }
                    }
                }, deleting ? speed / 2 : speed);
                return () => clearTimeout(timeout);
            }, [charIndex, deleting, wordIndex, words, speed, pause]);

            return text;
        };


        const useInView = (threshold = 0.2) => {
            const ref = React.useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold });
                obs.observe(el);
                return () => obs.disconnect();
            }, [threshold]);
            return [ref, visible];
        };


        const MagneticButton = ({ children, className = '', onClick, secondary }) => {
            const btnRef = React.useRef(null);
            const handleMove = (e) => {
                const btn = btnRef.current;
                if (!btn) return;
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
            };
            const handleLeave = () => {
                if (btnRef.current) btnRef.current.style.transform = '';
            };
            return (
                <button
                    ref={btnRef}
                    className={`magnetic-btn ${secondary ? 'secondary' : ''} ${className}`}
                    onMouseMove={handleMove}
                    onMouseLeave={handleLeave}
                    onClick={onClick}
                >{children}</button>
            );
        };

        const HeroSection = ({ setCurrentPage }) => {
            const typed = useTypingEffect(['Prioritize.', 'Ship.', 'Learn.', 'Lead.', 'Iterate.'], 90, 1800);
            const [demoReply, setDemoReply] = useState(null);

            const demoResponses = {
                'How do I break into PM?': 'Start with customer empathy, learn to prioritize ruthlessly, and ship small projects that show impact. PMory has frameworks to guide you!',
                'Prep me for interviews': 'Practice product sense, estimation, and behavioral questions. Head to our AI Assistant for mock interviews tailored to Emory students.',
                'What skills do PMs need?': 'Communication, empathy, data analysis, and strategic thinking. Explore our Skillsets page for a full breakdown.'
            };

            return (
                <section className="hero-v2">
                    <div className="hero-v2-left">
                        <span className="hero-eyebrow">Emory Product Management</span>
                        <h1>PMory</h1>
                        <div className="hero-typing">{typed}<span className="hero-typing-cursor" /></div>
                        <p className="hero-v2-desc">Your interactive hub for PM fundamentals, frameworks, and career growth — built by Emory students, for Emory students.</p>
                        <div className="hero-actions">
                            <MagneticButton onClick={() => setCurrentPage('ai-assistant')}>Start Your PM Journey</MagneticButton>
                            <MagneticButton secondary onClick={() => setCurrentPage('what-is-pm')}>Explore PM Basics</MagneticButton>
                        </div>
                    </div>
                    <div className="hero-v2-right">
                        <div className="hero-ai-demo">
                            <div className="hero-ai-header">PMory AI — try a question</div>
                            <div className="hero-ai-body">
                                {demoReply ? (
                                    <div className="hero-ai-bubble">{demoReply}</div>
                                ) : (
                                    <div className="hero-ai-bubble">Hey! I'm your PM career copilot. Tap a question to see how I can help.</div>
                                )}
                                <div className="hero-ai-chips">
                                    {Object.keys(demoResponses).map(q => (
                                        <button key={q} className="hero-ai-chip" onClick={() => setDemoReply(demoResponses[q])}>{q}</button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };


        const BentoGrid = ({ setCurrentPage }) => (
            <section className="bento-section">
                <div className="section-eyebrow">Explore PMory</div>
                <h2 className="section-title-v2">Everything you need to become a PM</h2>
                <p className="section-subtitle-v2">Tap any tile to dive in — fundamentals, skills, AI guidance, and job alerts.</p>
                <div className="bento-grid">
                    <div className="bento-card" onClick={() => setCurrentPage('what-is-pm')}>
                        <div className="bento-card-bg" style={{backgroundImage: 'url(./images/pm-fundamentals.jpg)'}} />
                        <h4>What is PM?</h4>
                        <p>Fundamentals & responsibilities</p>
                    </div>
                    <div className="bento-card" onClick={() => setCurrentPage('skillsets')}>
                        <div className="bento-card-bg" style={{backgroundImage: 'url(./images/pm-skills.jpg)'}} />
                        <h4>Skillsets</h4>
                        <p>Hard & soft skills</p>
                    </div>
                    <div className="bento-card" onClick={() => setCurrentPage('ai-assistant')}>
                        <div className="bento-card-bg" style={{backgroundImage: 'url(./images/ai-assistant.jpg)'}} />
                        <h4>AI Assistant</h4>
                        <p>Interview prep & guidance</p>
                    </div>
                    <div className="bento-card" onClick={() => setCurrentPage('job-alert')}>
                        <div className="bento-card-bg" style={{backgroundImage: 'url(./images/job-opportunities.jpg)'}} />
                        <h4>Job Alert</h4>
                        <p>Latest PM openings</p>
                    </div>
                </div>
            </section>
        );

        const PrioritizationBoard = () => {
            const initial = {
                now: ['Fix onboarding drop-off', 'Launch MVP dashboard'],
                next: ['Add push notifications', 'User research sprint'],
                later: ['Dark mode themes', 'Social sharing', 'Gamification']
            };
            const [columns, setColumns] = useState(initial);
            const [dragItem, setDragItem] = useState(null);

            const moveItem = (fromCol, item, toCol) => {
                if (fromCol === toCol) return;
                setColumns(prev => ({
                    ...prev,
                    [fromCol]: prev[fromCol].filter(i => i !== item),
                    [toCol]: [...prev[toCol], item]
                }));
            };

            const Column = ({ id, title, cls }) => (
                <div className={`prio-column ${cls}`}
                    onDragOver={e => e.preventDefault()}
                    onDrop={() => { if (dragItem) { moveItem(dragItem.col, dragItem.item, id); setDragItem(null); } }}>
                    <h4>{title}</h4>
                    {columns[id].map(item => (
                        <div key={item} className="prio-item" draggable
                            onDragStart={() => setDragItem({ col: id, item })}
                            onClick={() => {
                                const order = ['now', 'next', 'later'];
                                const next = order[(order.indexOf(id) + 1) % 3];
                                moveItem(id, item, next);
                            }}
                        >{item}</div>
                    ))}
                </div>
            );

            return (
                <section className="playground-section">
                    <h3>Prioritization Board</h3>
                    <p className="hint">Drag cards between columns — or tap to cycle Now → Next → Later</p>
                    <div className="prio-board">
                        <Column id="now" title="Now" cls="now" />
                        <Column id="next" title="Next" cls="next" />
                        <Column id="later" title="Later" cls="later" />
                    </div>
                </section>
            );
        };


        const StickyNoteWall = () => {
            const [notes, setNotes] = useState([
                { text: 'Talk to 5 users this week', color: 'yellow' },
                { text: 'Ship the MVP!', color: 'pink' },
                { text: 'What problem are we solving?', color: 'blue' }
            ]);
            const [input, setInput] = useState('');
            const colors = ['yellow', 'pink', 'blue', 'green'];

            const addNote = () => {
                if (!input.trim()) return;
                setNotes(prev => [...prev, { text: input.trim(), color: colors[prev.length % colors.length] }]);
                setInput('');
            };

            return (
                <section className="playground-section">
                    <h3>Brainstorm Wall</h3>
                    <p className="hint">Add your product ideas — just like a real PM workshop</p>
                    <div className="sticky-wall">
                        {notes.map((n, i) => (
                            <div key={i} className={`sticky-note ${n.color}`}>{n.text}</div>
                        ))}
                    </div>
                    <div className="sticky-input-row">
                        <input className="sticky-input" placeholder="Add an idea…" value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && addNote()} />
                        <MagneticButton onClick={addNote}>Add Note</MagneticButton>
                    </div>
                </section>
            );
        };

        const RoadmapTimeline = () => {
            const [ref, visible] = useInView(0.3);
            const steps = [
                { title: 'Discover', desc: 'Research users & market' },
                { title: 'Define', desc: 'Shape the problem' },
                { title: 'Design', desc: 'Prototype solutions' },
                { title: 'Deliver', desc: 'Ship & measure' },
                { title: 'Iterate', desc: 'Learn & improve' }
            ];
            return (
                <section className="playground-section" ref={ref}>
                    <h3>Product Roadmap</h3>
                    <p className="hint">The journey every great product takes</p>
                    <div className="roadmap">
                        <div className="roadmap-progress" style={{ width: visible ? '90%' : '0%' }} />
                        {steps.map((s, i) => (
                            <div key={s.title} className={`roadmap-item ${visible ? 'visible' : ''}`}
                                style={{ transitionDelay: `${i * 0.15}s` }}>
                                <div className="roadmap-dot" />
                                <h4>{s.title}</h4>
                                <p>{s.desc}</p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const ShipOrKill = () => {
            const features = [
                { id: 1, name: 'AI Resume Reviewer', desc: 'Auto-score PM resumes with feedback' },
                { id: 2, name: 'Campus PM Map', desc: 'Find PM clubs & events at Emory' },
                { id: 3, name: 'Daily PM Quiz', desc: '5-minute product sense challenge' },
                { id: 4, name: 'Mentor Matching', desc: 'Connect with alumni PMs' }
            ];
            const [votes, setVotes] = useState({});

            const handleVote = (id, type) => {
                setVotes(prev => ({ ...prev, [id]: type }));
            };

            const shipCount = Object.values(votes).filter(v => v === 'ship').length;
            const killCount = Object.values(votes).filter(v => v === 'kill').length;

            return (
                <section className="playground-section">
                    <h3>Ship or Kill?</h3>
                    <p className="hint">Vote on mock feature ideas — would you ship them?</p>
                    <div className="ship-grid">
                        {features.map(f => (
                            <div key={f.id} className={`ship-card ${votes[f.id] ? 'voted-' + votes[f.id] : ''}`}>

                                {!votes[f.id] && (
                                    <div className="ship-actions">
                                        <button className="ship-btn ship" onClick={() => handleVote(f.id, 'ship')}>Ship</button>
                                        <button className="ship-btn kill" onClick={() => handleVote(f.id, 'kill')}>Kill</button>
                                    </div>
                                )}
                                {votes[f.id] && <div style={{fontWeight: 600, color: votes[f.id] === 'ship' ? '#166534' : '#991b1b'}}>
                                    You voted: {votes[f.id] === 'ship' ? 'Ship' : 'Killed'}

                            </div>
                        ))}
                    </div>
                    {Object.keys(votes).length > 0 && (
                        <div className="ship-score">Community pulse: {shipCount} shipped, {killCount} killed</div>
                    )}

            );

        const HomePage = ({ setCurrentPage }) => (
            <div className="main page-transition">
                <div className="container">
                    <HeroSection setCurrentPage={setCurrentPage} />
                    <BentoGrid setCurrentPage={setCurrentPage} />
                </div>
                <div className="home-sections">
                    <PrioritizationBoard />
                    <StickyNoteWall />
                    <RoadmapTimeline />
                    <ShipOrKill />

        const WhatIsPM = () => {

const AIAssistant = () => {
    const [messages, setMessages] = useState([

    // Function to parse markdown-style formatting
const formatMessage = (text) => {
    // Split by lines first
    const lines = text.split('\n');
    
    return lines.map((line, lineIndex) => {
        // Parse bold markers in each line
        const parts = line.split(/(\*\*[^*]+\*\*)/g);
        const formattedLine = parts.map((part, partIndex) => {
            if (part.startsWith('**') && part.endsWith('**')) {
                return <strong key={`${lineIndex}-${partIndex}`}>{part.slice(2, -2)}</strong>;
            }
            return part;
        });
        
        return (
            <span key={lineIndex}>
                {formattedLine}
                {lineIndex < lines.length - 1 && <br />}
            </span>
        );
    });
};

    const handleSendMessage = async () => {
        if (!inputValue.trim()) return;

        // Track AI usage
        if (window.gtag) {
            window.gtag('event', 'ai_chat', {
                'event_category': 'ai_assistant',
                'event_label': 'message_sent'
            });
        }
        const userMessage = { type: 'user', content: inputValue };
        setMessages(prev => [...prev, userMessage]);
        const currentInput = inputValue;
        setInputValue('');
        setIsLoading(true);

        try {
            console.log('Sending message to AI:', currentInput);
            
            const response = await fetch(CHAT_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: currentInput
                })
            });

            console.log('Response status:', response.status);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            console.log('AI Response:', data);
            
            setMessages(prev => [...prev, { 
                type: 'ai', 
                content: data.response || 'Sorry, I encountered an error. Please try again.',
                metadata: {
                    model: data.ai_model || 'PMory AI',
                    knowledgeUsed: data.knowledge_used || false,
                    system: data.system || 'AI Assistant'
                }
            }]);
            
        } catch (error) {
            console.error('Error calling AI:', error);
            setMessages(prev => [...prev, { 
                type: 'ai', 
                content: 'Sorry, I encountered an error connecting to the AI. Please try again in a moment.'
            }]);
        }
        
        setIsLoading(false);
    };

    return (
        <div className="main page-transition">

                            PMory AI
                            <span className="chat-status-meta">Online · Claude Sonnet 5</span>
                        </div>
                    </div>
                    
                    <div className="chat-messages-modern">
                        {messages.map((message, index) => (

    const [jobs, setJobs] = useState([]);
    const [newJob, setNewJob] = useState({
        company: '',
        title: '',
        location: '',
        link: ''
    });
    
    // Load jobs when authorized
    useEffect(() => {
        if (isAuthorized) {
            const storedJobs = JSON.parse(localStorage.getItem('pmoryJobs') || '[]');
            setJobs(storedJobs);
        }
    }, [isAuthorized]);
    
    const handleAddJob = async () => {
        const jobToAdd = {
            ...newJob,
            id: Date.now(),
            status: 'open',
            postedDate: new Date().toISOString().split('T')[0]
        };
        
        const updatedJobs = [...jobs, jobToAdd];
        setJobs(updatedJobs);
        localStorage.setItem('pmoryJobs', JSON.stringify(updatedJobs));
        
        // Notify subscribers
        const subscribers = JSON.parse(localStorage.getItem('pmorySubscribers') || '[]');
        if (subscribers.length > 0) {
            await fetch(`${EMAIL_LAMBDA_URL}/notify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    emails: subscribers,
                    jobData: newJob
                })
            });
        }
        
        setNewJob({ company: '', title: '', location: '', link: '' });
    };
    
    const handleRemoveJob = (jobId) => {
        const updatedJobs = jobs.filter(job => job.id !== jobId);
        setJobs(updatedJobs);
        localStorage.setItem('pmoryJobs', JSON.stringify(updatedJobs));
    };
    
    const handleToggleStatus = (jobId) => {
        const updatedJobs = jobs.map(job => 
            job.id === jobId 
                ? { ...job, status: job.status === 'open' ? 'closed' : 'open' }
                : job
        );
        setJobs(updatedJobs);
        localStorage.setItem('pmoryJobs', JSON.stringify(updatedJobs));
    };
    
    if (!isAuthorized) {
        return (
            <div className="main page-transition">
                <div className="container">
                    <div className="admin-login">
                        <h2>Admin Access</h2>
                        <input 
                            type="password" 
                            className="form-input"
                            placeholder="Admin password"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && setIsAuthorized(password === 'dh960122!')}
                        />
                        <button 
                            className="btn btn-primary"
                            onClick={() => setIsAuthorized(password === 'dh960122!')}>
                            Login
                        </button>
                    </div>
                </div>
            </div>
        );
    }
    
    return (
        <div className="main page-transition">
            <div className="container">
                <div className="admin-panel">
                    <h2>Admin Dashboard</h2>
                    
                    <div className="admin-section">
                        <h3>Add New Job</h3>
                        <div className="form-group">
                            <input className="form-input" placeholder="Company" value={newJob.company} onChange={(e) => setNewJob({...newJob, company: e.target.value})} />
                        </div>
                        <div className="form-group">
                            <input className="form-input" placeholder="Title" value={newJob.title} onChange={(e) => setNewJob({...newJob, title: e.target.value})} />
                        </div>
                        <div className="form-group">
                            <input className="form-input" placeholder="Location" value={newJob.location} onChange={(e) => setNewJob({...newJob, location: e.target.value})} />
                        </div>
                        <div className="form-group">
                            <input className="form-input" placeholder="Link" value={newJob.link} onChange={(e) => setNewJob({...newJob, link: e.target.value})} />
                        </div>
                        <button className="btn btn-primary" onClick={handleAddJob}>Add Job & Notify Subscribers</button>
                    </div>
                    
                    <div className="admin-section" style={{marginTop: '3rem'}}>
                        <h3>Current Jobs ({jobs.length})</h3>
                        <div className="admin-jobs-list">
                            {jobs.map(job => (
                                <div key={job.id} className="admin-job-item" style={{
                                    background: 'white',
                                    padding: '1rem',
                                    marginBottom: '1rem',
                                    borderRadius: '8px',
                                    border: '1px solid #e5e7eb'
                                }}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                        <div>
                                            <strong>{job.title}</strong> at {job.company}
                                            <div style={{fontSize: '0.9rem', color: '#666'}}>
                                                {job.location} • Status: {job.status}
                                            </div>
                                        </div>
                                        <div style={{display: 'flex', gap: '0.5rem'}}>
                                            <button 
                                                className="btn btn-secondary"
                                                onClick={() => handleToggleStatus(job.id)}
                                                style={{padding: '0.5rem 1rem', fontSize: '0.9rem'}}
                                            >
                                                {job.status === 'open' ? 'Close' : 'Open'}
                                            </button>
                                            <button 
                                                className="btn btn-secondary"
                                                onClick={() => handleRemoveJob(job.id)}
                                                style={{padding: '0.5rem 1rem', fontSize: '0.9rem', background: '#ef4444', color: 'white'}}
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {jobs.length === 0 && (
                                <p style={{color: '#666'}}>No jobs added yet. Jobs will be stored locally.</p>
                            )}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

        // Footer Component
        const Footer = ({ setCurrentPage }) => (
    <footer className="footer">
        <div className="container">
            <p>© 2025 PMory - Product Management Hub for Emory Students</p>
            <p>Empowering the next generation of Product Managers</p>
            <div style={{marginTop: '2rem', opacity: 0.6, fontSize: '1.5rem'}}>
                <a onClick={() => setCurrentPage('admin')} style={{color: '#666', cursor: 'pointer'}}>
                    •
                </a>
            </div>
        </div>
    </footer>
);


        // Main App Component
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('pmory-theme') === 'dark');

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                localStorage.setItem('pmory-theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            // Handle browser history
useEffect(() => {
    // Only push state if it's different from current state
    if (window.location.hash !== `#${currentPage}`) {
        window.history.pushState({ page: currentPage }, '', `#${currentPage}`);
    }
    
    // Handle browser back/forward buttons
    const handlePopState = (event) => {
        if (event.state && event.state.page) {
            setCurrentPage(event.state.page);
        } else {
            // Handle initial page load from URL hash
            const hash = window.location.hash.slice(1) || 'home';
            setCurrentPage(hash);
        }
    };
    
    window.addEventListener('popstate', handlePopState);
    
    return () => window.removeEventListener('popstate', handlePopState);
}, [currentPage]);

    // Initialize from URL on first load
    useEffect(() => {
        const hash = window.location.hash.slice(1) || 'home';
        setCurrentPage(hash);
    }, []);

            const renderPage = () => {
                switch(currentPage) {
                    case 'home':
                        return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'what-is-pm':
                        return <WhatIsPM />;
                    case 'skillsets':
                        return <Skillsets />;
                    case 'ai-assistant':
                        return <AIAssistant />;
                    case 'job-alert':
                        return <JobAlert />;
                    case 'about':
                        return <About />;
                    case 'admin':  // Add this new case
                        return <AdminPanel />;
                    default:
                        return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };

            return (
                <div>
                    <Header currentPage={currentPage} setCurrentPage={setCurrentPage} darkMode={darkMode} setDarkMode={setDarkMode} />
                    <div key={currentPage} className={currentPage !== 'home' ? 'page-transition' : ''}>
                        {renderPage()}
                    </div>
                    <Footer setCurrentPage={setCurrentPage}/>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
